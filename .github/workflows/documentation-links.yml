name: Documentation links

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  documentation-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Test documentation checker
        run: node --test scripts/tests/documentation-links.test.mjs
      - name: Check tracked documentation links
        run: node scripts/check-documentation-links.mjs --all
